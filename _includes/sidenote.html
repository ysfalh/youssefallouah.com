{%- assign reference = page.references | where: "id", include.id | first -%}
<sup class="sidenote-callout"><a href="#note-{{ reference.number }}" id="note-ref-{{ reference.number }}" role="doc-noteref" aria-label="Note {{ reference.number }}">{{ reference.number }}</a></sup><span class="sidenote" id="note-{{ reference.number }}" role="note" aria-label="Note {{ reference.number }}" tabindex="-1"><span class="sidenote-number">{{ reference.number }}.</span> {% include citation.html reference=reference %} <a class="sidenote-return" href="#note-ref-{{ reference.number }}" role="doc-backlink" aria-label="Return to text for note {{ reference.number }}">↩</a></span>{%- comment -%}Keep the citation attached to the surrounding sentence.{%- endcomment -%}
